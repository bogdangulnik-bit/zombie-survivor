<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Neon Zombie Survivor PRO</title>
<link rel="manifest" href="manifest.json">
<style>
*{margin:0;padding:0;box-sizing:border-box;touch-action:none;user-select:none}
body{background:#050508;color:white;font-family:Arial;overflow:hidden}
canvas{display:block;width:100vw;height:100vh}
#ui{position:fixed;top:0;left:0;right:0;padding:12px;display:flex;justify-content:space-between;z-index:10;background:linear-gradient(to bottom,rgba(0,0,0,.7),transparent)}
#hpWrap{width:160px;height:16px;background:#222;border:2px solid #fff;border-radius:10px;overflow:hidden}
#hpFill{height:100%;width:100%;background:linear-gradient(90deg,#ff2d55,#ff9500);transition:width .2s}
#xpWrap{width:160px;height:8px;background:#222;border-radius:5px;overflow:hidden;margin-top:4px}
#xpFill{height:100%;width:0%;background:#00e5ff}
#joyBase{position:fixed;width:130px;height:130px;border:2px solid rgba(255,255,255,.4);background:rgba(255,255,255,.08);border-radius:50%;display:none;z-index:20;pointer-events:none}
#joyStick{position:absolute;width:55px;height:55px;background:rgba(255,255,255,.9);border-radius:50%;left:37px;top:37px;box-shadow:0 0 20px white}
#btnSound{position:fixed;top:70px;right:12px;z-index:30;background:rgba(0,0,0,.6);border:1px solid white;color:white;padding:8px 12px;border-radius:20px;font-size:16px}
#over{display:none;position:fixed;inset:0;background:rgba(0,0,0,.9);text-align:center;padding-top:30vh;z-index:40}
#over button{padding:14px 30px;font-size:20px;background:#ff2d55;color:white;border:none;border-radius:12px;margin-top:20px}
#dmg{position:fixed;inset:0;background:red;opacity:0;pointer-events:none;z-index:15}
.badge{background:rgba(255,255,255,.15);padding:6px 12px;border-radius:20px;font-weight:bold}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="ui">
<div><div class="badge">🧟 VAL <span id="wave">1</span> | 💀 <span id="kills">0</span></div><div id="xpWrap"><div id="xpFill"></div></div></div>
<div><div id="hpWrap"><div id="hpFill"></div></div><div style="text-align:right;font-size:13px;margin-top:3px">❤️ <span id="hp">100</span> | ⭐ LVL <span id="lvl">1</span></div></div>
</div>
<button id="btnSound" onclick="toggleSound()">🔊 ZVUK: ON</button>
<div id="joyBase"><div id="joyStick"></div></div>
<div id="dmg"></div>
<div id="over"><h1 style="font-size:40px">💀 GAME OVER</h1><p id="final" style="margin-top:10px;font-size:18px"></p><button onclick="location.reload()">IGRAJ OPET 🔁</button></div>
<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
canvas.width=innerWidth;canvas.height=innerHeight;
let audioCtx=null,soundOn=true;
function initAudio(){if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();}
function beep(f,d,t='square',v=0.12){if(!soundOn||!audioCtx)return;let o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=t;o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+d);}
function playShoot(){beep(800,0.08,'square',0.07);}
function playHit(){beep(200,0.1,'sawtooth',0.1);}
function playWave(){beep(440,0.15,'sine',0.2);setTimeout(()=>beep(660,0.15,'sine',0.2),150);setTimeout(()=>beep(880,0.2,'sine',0.2),300);}
function playGameOver(){beep(300,0.4,'sawtooth',0.2);setTimeout(()=>beep(200,0.4,'sawtooth',0.2),400);setTimeout(()=>beep(100,0.6,'sawtooth',0.2),800);}
function playLevelUp(){beep(523,0.1,'sine',0.2);setTimeout(()=>beep(659,0.1,'sine',0.2),100);setTimeout(()=>beep(784,0.2,'sine',0.2),200);}
function toggleSound(){soundOn=!soundOn;document.getElementById('btnSound').textContent=soundOn?'🔊 ZVUK: ON':'🔇 ZVUK: OFF';initAudio();}
addEventListener('touchstart',initAudio,{once:true});addEventListener('click',initAudio,{once:true});
let player={x:innerWidth/2,y:innerHeight/2,r:20,hp:100,maxHp:100,speed:3.8,damage:20,level:1,xp:0,xpNeed:5};
let zombies=[],bullets=[],particles=[],pickups=[];
let kills=0,wave=1,waveTime=0;
let joy={active:false,id:null,baseX:0,baseY:0,dx:0,dy:0};
const joyBase=document.getElementById('joyBase'),joyStick=document.getElementById('joyStick');
addEventListener('touchstart',e=>{
if(joy.active)return;let t=e.touches[0];
if(t.clientY<110&&t.clientX>innerWidth-120)return;
joy.active=true;joy.id=t.identifier;joy.baseX=t.clientX;joy.baseY=t.clientY;joy.dx=0;joy.dy=0;
joyBase.style.display='block';joyBase.style.left=(t.clientX-65)+'px';joyBase.style.top=(t.clientY-65)+'px';
joyStick.style.left='37px';joyStick.style.top='37px';
},{passive:true});
addEventListener('touchmove',e=>{
for(let t of e.touches){if(t.identifier===joy.id){let dx=t.clientX-joy.baseX,dy=t.clientY-joy.baseY;let len=Math.hypot(dx,dy)||1;if(len>50){dx=dx/len*50;dy=dy/len*50;}joy.dx=dx/50;joy.dy=dy/50;joyStick.style.left=(37+dx)+'px';joyStick.style.top=(37+dy)+'px';}}
},{passive:true});
addEventListener('touchend',e=>{for(let t of e.changedTouches){if(t.identifier===joy.id){joy.active=false;joy.dx=0;joy.dy=0;joyBase.style.display='none';}}});
let keys={};addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
function spawnZombie(isBoss=false){
let side=Math.floor(Math.random()*4),x,y;
if(side==0){x=Math.random()*innerWidth;y=-40}if(side==1){x=innerWidth+40;y=Math.random()*innerHeight}if(side==2){x=Math.random()*innerWidth;y=innerHeight+40}if(side==3){x=-40;y=Math.random()*innerHeight}
let type=isBoss?'boss':'normal';
if(!isBoss&&wave>=2&&Math.random()<0.12)type='elite';
else if(!isBoss)type=(Math.random()<0.2?'fast':(Math.random()<0.15?'tank':'normal'));
let z={x,y,type,hp:0,maxHp:0,speed:0,r:18,damage:0.5};
if(type==='normal'){z.hp=25+wave*10;z.speed=1.0+wave*0.12;z.r=18;z.damage=0.5}
if(type==='fast'){z.hp=15+wave*6;z.speed=2.2+wave*0.15;z.r=14;z.damage=0.3}
if(type==='tank'){z.hp=80+wave*25;z.speed=0.6+wave*0.05;z.r=28;z.damage=1.0}
if(type==='elite'){z.hp=150+wave*40;z.speed=1.3+wave*0.08;z.r=32;z.damage=1.2}
if(type==='boss'){z.hp=400+wave*100;z.speed=0.9;z.r=45;z.damage=1.5}
z.maxHp=z.hp;zombies.push(z);
}
function spawnPickup(x,y){if(Math.random()<0.15)pickups.push({x,y,type:Math.random()<0.5?'hp':'xp',r:12});}
function shoot(){if(zombies.length==0)return;let nearest=zombies[0],best=Infinity;for(let z of zombies){let d=Math.hypot(z.x-player.x,z.y-player.y);if(d<best){best=d;nearest=z;}}let ang=Math.atan2(nearest.y-player.y,nearest.x-player.x);bullets.push({x:player.x,y:player.y,vx:Math.cos(ang)*9,vy:Math.sin(ang)*9});playShoot();}
setInterval(shoot,280);
setInterval(()=>{let n=2+wave;if(wave%5==0&&zombies.filter(z=>z.type==='boss').length==0)spawnZombie(true);for(let i=0;i<n;i++)spawnZombie();},800);
function addParticle(x,y,color,n=6){for(let i=0;i<n;i++)particles.push({x,y,vx:(Math.random()-0.5)*6,vy:(Math.random()-0.5)*6,life:30,color});}
function update(){
let mx=0,my=0;
if(keys['w']||keys['arrowup'])my-=1;if(keys['s']||keys['arrowdown'])my+=1;if(keys['a']||keys['arrowleft'])mx-=1;if(keys['d']||keys['arrowright'])mx+=1;
if(joy.active){mx+=joy.dx;my+=joy.dy;}
let l=Math.hypot(mx,my)||1;player.x+=mx/l*player.speed;player.y+=my/l*player.speed;
player.x=Math.max(25,Math.min(innerWidth-25,player.x));player.y=Math.max(25,Math.min(innerHeight-25,player.y));
for(let z of zombies){let ang=Math.atan2(player.y-z.y,player.x-z.x);z.x+=Math.cos(ang)*z.speed;z.y+=Math.sin(ang)*z.speed;
if(Math.hypot(z.x-player.x,z.y-player.y)<z.r+player.r){player.hp-=z.damage;document.getElementById('dmg').style.opacity=0.35;setTimeout(()=>document.getElementById('dmg').style.opacity=0,80);document.getElementById('hp').textContent=Math.ceil(player.hp);document.getElementById('hpFill').style.width=(player.hp/player.maxHp*100)+'%';if(player.hp<=0){playGameOver();document.getElementById('over').style.display='block';document.getElementById('final').textContent='Val: '+wave+' | Ubio: '+kills+' zombija | Level: '+player.level;return false;}}}
for(let b of bullets){b.x+=b.vx;b.y+=b.vy;}bullets=bullets.filter(b=>b.x>0&&b.x<innerWidth&&b.y>0&&b.y<innerHeight);
for(let b of bullets){for(let z of zombies){if(Math.hypot(b.x-z.x,b.y-z.y)<z.r+7){z.hp-=player.damage;b.x=-999;playHit();addParticle(z.x,z.y,'#ff2d55',3);if(z.hp<=0){kills++;addParticle(z.x,z.y,'#39ff14',10);if(z.type==='elite'){addParticle(z.x,z.y,'#ff00ff',25);addParticle(z.x,z.y,'#00e5ff',20);addParticle(z.x,z.y,'#ff2d95',20);addParticle(z.x,z.y,'#ffff00',15);beep(150,0.3,'sawtooth',0.25);player.xp+=3;}if(z.type==='boss'){addParticle(z.x,z.y,'#ff0000',40);addParticle(z.x,z.y,'#ff9500',30);}spawnPickup(z.x,z.y);player.xp++;if(player.xp>=player.xpNeed){player.level++;player.xp=0;player.xpNeed+=3;player.damage+=6;player.maxHp+=15;player.hp=player.maxHp;playLevelUp();document.getElementById('lvl').textContent=player.level;}zombies.splice(zombies.indexOf(z),1);}}}}
zombies=zombies.filter(z=>z.hp>0);
for(let p of pickups){if(Math.hypot(p.x-player.x,p.y-player.y)<player.r+p.r){if(p.type==='hp'){player.hp=Math.min(player.maxHp,player.hp+25);document.getElementById('hp').textContent=Math.ceil(player.hp);document.getElementById('hpFill').style.width=(player.hp/player.maxHp*100)+'%';}else{player.xp+=2;}pickups.splice(pickups.indexOf(p),1);}}
document.getElementById('xpFill').style.width=(player.xp/player.xpNeed*100)+'%';
waveTime++;if(waveTime>500){wave++;waveTime=0;playWave();document.getElementById('wave').textContent=wave;}
document.getElementById('kills').textContent=kills;
particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.life--;});particles=particles.filter(p=>p.life>0);return true;
}
function drawZombie(z){ctx.save();ctx.shadowBlur=18;ctx.shadowColor=z.type==='boss'?'#ff0000':z.type==='elite'?'#bf00ff':z.type==='fast'?'#ffff00':z.type==='tank'?'#ff00ff':'#39ff14';ctx.fillStyle=z.type==='boss'?'#ff0000':z.type==='elite'?'#bf00ff':z.type==='fast'?'#ffff00':z.type==='tank'?'#ff00ff':'#2ecc71';ctx.beginPath();ctx.arc(z.x,z.y,z.r,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='black';ctx.beginPath();ctx.arc(z.x-6,z.y-4,3,0,Math.PI*2);ctx.arc(z.x+6,z.y-4,3,0,Math.PI*2);ctx.fill();ctx.fillStyle='red';ctx.fillRect(z.x-2,z.y-2,4,2);if(z.type!=='normal'){ctx.fillStyle='#333';ctx.fillRect(z.x-z.r,z.y-z.r-12,z.r*2,5);ctx.fillStyle='#ff2d55';ctx.fillRect(z.x-z.r,z.y-z.r-12,z.r*2*(z.hp/z.maxHp),5);}ctx.restore();ctx.font=(z.r+8)+'px Arial';ctx.textAlign='center';ctx.fillText(z.type==='boss'?'👹':z.type==='elite'?'👑':z.type==='fast'?'🏃':z.type==='tank'?'💪':'🧟',z.x,z.y+8);}
function draw(){ctx.fillStyle='#0a120a';ctx.fillRect(0,0,innerWidth,innerHeight);ctx.strokeStyle='rgba(57,255,20,0.08)';for(let x=0;x<innerWidth;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,innerHeight);ctx.stroke();}for(let y=0;y<innerHeight;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(innerWidth,y);ctx.stroke();}for(let p of pickups){ctx.save();ctx.shadowBlur=15;ctx.shadowColor=p.type==='hp'?'#ff2d55':'#00e5ff';ctx.fillStyle=p.type==='hp'?'#ff2d55':'#00e5ff';ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();ctx.restore();ctx.fillStyle='white';ctx.font='14px Arial';ctx.fillText(p.type==='hp'?'❤️':'⭐',p.x,p.y+5);}for(let z of zombies)drawZombie(z);for(let b of bullets){ctx.save();ctx.shadowBlur=12;ctx.shadowColor='yellow';ctx.fillStyle='yellow';ctx.beginPath();ctx.arc(b.x,b.y,6,0,Math.PI*2);ctx.fill();ctx.restore();}for(let p of particles){ctx.globalAlpha=p.life/30;ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,4,0,Math.PI*2);ctx.fill();}ctx.globalAlpha=1;ctx.save();ctx.shadowBlur=20;ctx.shadowColor='#00e5ff';ctx.fillStyle='#00e5ff';ctx.beginPath();ctx.arc(player.x,player.y,player.r,0,Math.PI*2);ctx.fill();ctx.restore();ctx.font='24px Arial';ctx.textAlign='center';ctx.fillText('🦦',player.x,player.y+8);}
function loop(){if(update()!==false){draw();requestAnimationFrame(loop);}}loop();
</script>
</body>
</html>
